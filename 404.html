<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Caitlyn Lee — Portfolio</title>
    <!--
      GitHub Pages SPA redirect (rafgraph/spa-github-pages).
      Rewrites a deep-link 404 into a query string the app decodes in index.html,
      so client-side routes like /caitlynlee/work survive a hard refresh.
      pathSegmentsToKeep = 1 keeps the "/caitlynlee" project base.
    -->
    <script>
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
